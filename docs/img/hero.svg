<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="intent-check compares what you asked for with what the agent did">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1530"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="820" height="360" rx="20" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- request card -->
    <rect x="32" y="40" width="300" height="280" rx="14" fill="#1E1B3A" stroke="#3B3363"/>
    <text x="52" y="72" font-size="13" font-weight="700" fill="#A78BFA" letter-spacing="1.5">YOU ASKED</text>
    <text font-size="15" fill="#E2E8F0">
      <tspan x="52" y="106">"Add truncate, capitalize_words,</tspan>
      <tspan x="52" y="128">count_words and reverse_words,</tspan>
      <tspan x="52" y="150">a test for each, and list them</tspan>
      <tspan x="52" y="172">in the README."</tspan>
    </text>
    <text x="52" y="230" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="1.5">AGENT SAID</text>
    <text x="52" y="262" font-size="15" fill="#E2E8F0">"Done! Each function has</text>
    <text x="52" y="284" font-size="15" fill="#E2E8F0">a unit test."</text>

    <!-- arrow -->
    <path d="M352 180 h44" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>
    <path d="M388 170 l12 10 l-12 10" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- report card -->
    <rect x="420" y="40" width="368" height="280" rx="14" fill="#111827" stroke="#334155"/>
    <rect x="420" y="40" width="368" height="6" rx="3" fill="url(#accent)"/>
    <text x="442" y="76" font-size="18" font-weight="800" fill="#F8FAFC">intent-check</text>
    <text x="566" y="76" font-size="13" fill="#94A3B8">report</text>

    <g font-size="14" fill="#E2E8F0">
      <circle cx="452" cy="111" r="10" fill="#16A34A"/><path d="M447 111 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="472" y="116">4 functions exist</text>
      <circle cx="452" cy="147" r="10" fill="#16A34A"/><path d="M447 147 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="472" y="152">Listed in the README</text>
      <circle cx="452" cy="183" r="10" fill="#DC2626"/><path d="M448 179 l8 8 M456 179 l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="472" y="188">A test for each <tspan fill="#FCA5A5">(reverse_words has none)</tspan></text>
    </g>

    <rect x="442" y="210" width="324" height="1" fill="#334155"/>
    <text x="442" y="240" font-size="13" font-weight="700" fill="#22D3EE" letter-spacing="1.5">FIX ROUND 1</text>
    <text x="442" y="266" font-size="14" fill="#CBD5E1">Test added, then <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#E2E8F0">python3 -m unittest</tspan></text>
    <circle cx="452" cy="293" r="10" fill="#16A34A"/><path d="M447 293 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="472" y="298" font-size="14" font-weight="700" fill="#86EFAC">5/5 OK, all criteria met</text>
  </g>
</svg>
